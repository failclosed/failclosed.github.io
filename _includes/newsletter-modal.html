<div id="newsletter-modal-overlay" class="newsletter-modal-overlay" hidden>
  <div class="newsletter-modal-box" role="dialog" aria-modal="true" aria-labelledby="newsletter-modal-title">
    <button type="button" class="newsletter-modal-close" aria-label="Close">&times;</button>
    <h3 id="newsletter-modal-title">Behind the Firewall</h3>
    <p>Cybersecurity and GRC, explained plainly.</p>
    <div class="newsletter-modal-iframe-wrap">
      <iframe id="newsletter-modal-iframe" title="Subscribe to Behind the Firewall" frameborder="0" scrolling="no"></iframe>
    </div>
  </div>
</div>

<style>
.newsletter-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  padding: 20px;
}
.newsletter-modal-overlay[hidden] {
  display: none;
}
.newsletter-modal-box {
  position: relative;
  background: #fff;
  border-radius: 10px;
  padding: 28px 24px 20px;
  max-width: 480px;
  width: 100%;
  text-align: center;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
}
.newsletter-modal-box h3 {
  margin: 0 0 6px;
}
.newsletter-modal-box p {
  margin: 0 0 16px;
  color: #666;
}
.newsletter-modal-close {
  position: absolute;
  top: 8px;
  right: 12px;
  background: none;
  border: none;
  font-size: 1.6em;
  line-height: 1;
  cursor: pointer;
  color: #999;
}
.newsletter-modal-close:hover {
  color: #333;
}
.newsletter-modal-iframe-wrap iframe {
  width: 100%;
  height: 320px;
  border: none;
}
</style>

<script>
(function () {
  var overlay = document.getElementById("newsletter-modal-overlay");
  var iframe = document.getElementById("newsletter-modal-iframe");
  var closeBtn = overlay.querySelector(".newsletter-modal-close");
  var embedSrc = "https://news.failclosed.com/embed";
  var lastFocused = null;

  function openModal(e) {
    if (e) { e.preventDefault(); }
    if (!iframe.src) { iframe.src = embedSrc; }
    lastFocused = document.activeElement;
    overlay.hidden = false;
    closeBtn.focus();
  }

  function closeModal() {
    overlay.hidden = true;
    if (lastFocused) { lastFocused.focus(); }
  }

  document.querySelectorAll("[data-newsletter-modal-trigger]").forEach(function (el) {
    el.addEventListener("click", openModal);
  });

  closeBtn.addEventListener("click", closeModal);

  overlay.addEventListener("click", function (e) {
    if (e.target === overlay) { closeModal(); }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !overlay.hidden) { closeModal(); }
  });
})();
</script>
